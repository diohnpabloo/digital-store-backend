services:
  mysql:
    image: mysql:8.4
    container_name: digital-store-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: digital_store
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # Cria também o banco usado pelos testes automatizados
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data:
